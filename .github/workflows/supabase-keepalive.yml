name: Supabase Keepalive

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query keepalive table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node <<'NODE'
          const { SUPABASE_URL: url, SUPABASE_ANON_KEY: key } = process.env;
          if (!url || !key) throw new Error('Missing Supabase repository secrets');

          const response = await fetch(`${url.replace(/\/$/, '')}/rest/v1/keepalive?limit=0`, {
            headers: {
              apikey: key,
              authorization: `Bearer ${key}`,
            },
            signal: AbortSignal.timeout(20000),
          });

          if (!response.ok) {
            throw new Error(`Supabase keepalive failed: HTTP ${response.status}`);
          }

          console.log(`syllascan: active (${response.status})`);
          NODE
